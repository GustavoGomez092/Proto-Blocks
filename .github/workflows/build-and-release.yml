name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-release-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # delete/create the rolling release + tag
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # `npm ci` only: a drifted lockfile must fail the build, never be
        # silently re-resolved into a release artefact.
        run: npm ci

      - name: Build plugin and create zip
        run: npm run dist

      - name: Resolve plugin version
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Confirm artifact exists
        env:
          ZIP: dist/proto-blocks-${{ steps.meta.outputs.version }}.zip
        run: |
          ls -la dist/
          test -f "$ZIP" || { echo "::error::$ZIP missing after build"; exit 1; }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proto-blocks-${{ steps.meta.outputs.version }}-${{ github.sha }}
          path: dist/proto-blocks-${{ steps.meta.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Update rolling 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          ZIP="dist/proto-blocks-${VERSION}.zip"
          SHA_SHORT="${GITHUB_SHA::7}"
          COMMIT_MSG=$(git log -1 --format='%s')
          BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          NOTES=$(cat <<EOF
          Automatic build of \`main\` at commit [\`$SHA_SHORT\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA).

          **Version:** $VERSION

          **Latest commit:** $COMMIT_MSG

          **Built:** $BUILD_TIME

          ---

          Download \`proto-blocks-${VERSION}.zip\` below, then in WordPress go to **Plugins -> Add New -> Upload Plugin** to install.
          EOF
          )

          # --latest=false: this rolling build must never be the release GitHub
          # marks "Latest" (/releases/latest). Otherwise, since it is created
          # after the versioned release, it wins by creation date and serves a
          # zip built from the pre-bump commit. release.yml marks vX.Y.Z latest.
          # Idempotent: delete the previous rolling release + its tag if either exists
          gh release delete latest \
            --yes \
            --cleanup-tag \
            --repo "$GITHUB_REPOSITORY" \
            2>/dev/null || true

          gh release create latest \
            "$ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest build (main)" \
            --latest=false \
            --notes "$NOTES" \
            --target "$GITHUB_SHA"
