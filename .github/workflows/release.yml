name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # push bump commit/tag, create + upload the release
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # need full history + tags to diff commits since last release

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test version logic
        run: npm run test:scripts

      - name: Determine version bump
        id: bump
        run: |
          set -euo pipefail

          # Loop guard: never release off our own release commit. The commit
          # carries [skip ci], which GitHub honors for push events; this subject
          # check additionally covers manual workflow_dispatch runs (which
          # [skip ci] does NOT skip).
          SUBJECT=$(git log -1 --format=%s)
          if printf '%s' "$SUBJECT" | grep -q '^chore(release):'; then
            echo "Release commit detected; skipping."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          CURRENT=$(node -p "require('./package.json').version")

          # Pipe full commit messages (record-separated by 0x1e) to the resolver.
          OUT=$(git log "$RANGE" --format='%B%x1e' \
            | CURRENT_VERSION="$CURRENT" node scripts/next-version.mjs)

          if [ -z "$OUT" ]; then
            echo "No release-worthy commits since ${LAST_TAG:-start}; skipping."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "$OUT" >> "$GITHUB_OUTPUT"   # version=X.Y.Z and type=...
            echo "Bumping ${CURRENT} -> $(echo "$OUT" | sed -n 's/^version=//p')"
          fi

      - name: Bump version files
        if: steps.bump.outputs.release == 'true'
        env:
          NEW: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail

          npm version "$NEW" --no-git-tag-version --allow-same-version

          sed -i -E "s/^( \* Version:[[:space:]]*).*/\1${NEW}/" proto-blocks.php
          sed -i -E "s/(define\('PROTO_BLOCKS_VERSION', ')[^']*('\);)/\1${NEW}\2/" proto-blocks.php

          # Fail loudly if either replacement did not land (no half-bumped state).
          grep -q "Version: ${NEW}" proto-blocks.php
          grep -q "PROTO_BLOCKS_VERSION', '${NEW}'" proto-blocks.php

      - name: Commit, tag, and push
        if: steps.bump.outputs.release == 'true'
        env:
          NEW: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json proto-blocks.php
          git commit -m "chore(release): v${NEW} [skip ci]"
          git tag "v${NEW}"

          git push origin HEAD:main
          git push origin "v${NEW}"

      - name: Build plugin zip
        if: steps.bump.outputs.release == 'true'
        run: npm run dist

      - name: Create versioned release
        if: steps.bump.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="dist/proto-blocks-${NEW}.zip"
          test -f "$ZIP" || { echo "::error::$ZIP missing"; exit 1; }

          # Integrity: publish the zip's sha256 as a sidecar asset AND as a
          # `sha256: <hex>` line in the release body. GitHubUpdater verifies
          # the download against it before WordPress unpacks the package, so
          # a replaced asset on an existing release no longer installs.
          SHA=$(sha256sum "$ZIP" | cut -d' ' -f1)
          ( cd dist && sha256sum "proto-blocks-${NEW}.zip" > "proto-blocks-${NEW}.zip.sha256" )
          echo "sha256: ${SHA}"

          # Same auto-generated notes as --generate-notes, with the checksum
          # appended (the API prepends --notes to generated notes; we want
          # the hash as the last line).
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="v${NEW}" --jq .body > "$NOTES_FILE"
          printf '\n\n---\nsha256: %s\n' "$SHA" >> "$NOTES_FILE"

          gh release create "v${NEW}" \
            "$ZIP" \
            "${ZIP}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v${NEW}" \
            --latest \
            --notes-file "$NOTES_FILE"
